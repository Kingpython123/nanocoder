# 复制到 .github/workflows/nano-fix-ci.yml，并在目标分支上放一个 .nanocoder.yml。
# 需要三个 secret：NANOCODER_TOKEN（细粒度 PAT，contents 和 pull requests 写）、LLM_API_KEY、LLM_BASE_URL。
#
# 这个 workflow 不要 actions/checkout：PR 的代码由 nanocoder 取到容器里运行，不能在这里执行。
name: nano fix-ci
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  fix:
    if: github.event.issue.pull_request && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/nano fix-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: OWNER/nanocoder@main # 换成实际的仓库和固定的提交
        with:
          token: ${{ secrets.NANOCODER_TOKEN }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
          model: gpt-6.1-terra
