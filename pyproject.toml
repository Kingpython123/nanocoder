[project]
name = "nanocoder"
version = "0.1.0"
description = "从零手写的仓库级修 bug Agent（ReAct 循环、沙箱、评测）"
readme = "README.md"
requires-python = ">=3.10"
# 依赖版本精确锁定，避免上游升级导致行为变化
dependencies = [
    "openai==3.26.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.scripts]
nanocoder = "nanocoder.cifix.__main__:main"

[project.optional-dependencies]
# 玩具任务集和本地沙箱需要 pytest
coding = [
    "pytest==9.2.0",
]
# SWE-bench 评测（在 Linux / WSL2 里运行，需要 Docker）
swebench = [
    "swebench==5.0.2",
    "datasets==5.1.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniagent", "src/nanocoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
